name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build userscript
        run: npm run build

      - name: Ensure release artifact exists
        run: test -f dist/yandex-tracker-ai-copy-button.user.js

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: userscript-dist
          path: dist/yandex-tracker-ai-copy-button.user.js

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/yandex-tracker-ai-copy-button.user.js
          generate_release_notes: true
